<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantex · Dashboard Produção</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #091628;
    --card:      #0d2040;
    --border:    #1a3356;
    --green:     #1D9E75;
    --yellow:    #EF9F27;
    --green2:    #5DCAA5;
    --green3:    #27C77A;
    --text:      #c8d8ea;
    --muted:     #6888a8;
    --gold:      #EF9F27;
    --silver:    #B4B2A9;
    --bronze:    #CD7F32;
    --bar0:      #1e3a55;
    --header-h:  64px;
    --footer-h:  64px;
  }

  /*  TEMA CLARO */
  :root.light {
    --bg:     #dce8f4;
    --card:   #f0f6fc;
    --border: #7aaad0;
    --text:   #071428;
    --muted:  #1e4268;
    --bar0:   #7aa0c0;
  }

  /* Header e footer com fundo próprio no claro */
  :root.light #header,
  :root.light #footer {
    background: #0d2040;
    border-color: #1a3356;
  }
  /* Texto do header fixo em claro sobre fundo escuro */
  :root.light .hd-title         { color: #7aaad0; }
  :root.light .hd-month         { color: #ffffff; }
  :root.light .hd-days          { color: #7aaad0; }
  :root.light .hd-total         { color: #7aaad0; }
  :root.light .hd-total span    { color: #27C77A; }
  :root.light .hd-clock         { color: #ffffff; }
  :root.light .hd-shift         { color: #7aaad0; }
  :root.light .ft-label         { color: #7aaad0; }
  :root.light .ft-rank-name     { color: #c8d8ea; }
  :root.light .ft-rank-pct      { color: #7aaad0; }
  :root.light #ft-update        { color: #4a6888; }
  :root.light .ft-sep           { background: #1a3356; }
  :root.light #theme-btn        { border-color: #3a6a9a; color: #c8d8ea; }

  /* Cards do grid em azul escuro */
  :root.light .mcard {
    background: #0d2040;
    border-color: #2a5080;
  }
  :root.light .mcard-name       { color: #7aaad0; }
  :root.light .shift-col        { background: rgba(255,255,255,.06); border-color: #2a5080; }
  :root.light .shift-label      { color: #7aaad0; }
  :root.light .shift-total      { color: #ffffff; }
  :root.light .shift-meta       { color: #7aaad0; }
  :root.light .shift-meta span  { color: #c8d8ea; }
  :root.light .bar-wrap         { background: rgba(255,255,255,.12); }
  :root.light .rank-badge       { border-color: #2a5080; color: #7aaad0; }
  :root.light .bonus-value      { color: #27C77A; }
  :root.light .bb0              { background: rgba(255,255,255,.07); color: #7aaad0; }

  /*  LOGO  */
  #logo-wrap { display: flex; align-items: center; }
  #header-logo { height: 48px; width: auto; }

  /*  BOTÃO DE TEMA  */
  #theme-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: .2rem .55rem;
    font-size: .7rem;
    cursor: pointer;
    transition: border-color .2s, color .2s;
    line-height: 1.6;
  }
  #theme-btn:hover { border-color: var(--green); color: var(--green); }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  /*  KEYFRAMES  */
  @keyframes pulse-border {
    0%,100% { box-shadow: 0 0 0 0 rgba(39,199,122,.55), 0 0 18px 2px rgba(39,199,122,.18); }
    50%      { box-shadow: 0 0 0 4px rgba(39,199,122,.2),  0 0 32px 6px rgba(39,199,122,.32); }
  }
  @keyframes pulse-bar {
    0%,100% { opacity: 1; }
    50%      { opacity: .7; }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes glowGold {
    0%,100% { border-color: #EF9F27; box-shadow: 0 0 8px 2px rgba(239,159,39,.30); }
    50%      { border-color: #FFD700; box-shadow: 0 0 18px 4px rgba(255,215,0,.45); }
  }
  @keyframes glowSilver {
    0%,100% { border-color: #B4B2A9; box-shadow: 0 0 6px 1px rgba(180,178,169,.25); }
    50%      { border-color: #E8E8E8; box-shadow: 0 0 14px 3px rgba(232,232,232,.35); }
  }
  @keyframes glowBronze {
    0%,100% { border-color: #CD7F32; box-shadow: 0 0 6px 1px rgba(205,127,50,.25); }
    50%      { border-color: #E8A857; box-shadow: 0 0 14px 3px rgba(232,168,87,.35); }
  }
  @keyframes bounceTrophy {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  @keyframes glowPulseGold {
    0%,100% { filter: drop-shadow(0 0 3px rgba(255,215,0,.5)); }
    50%      { filter: drop-shadow(0 0 10px rgba(255,215,0,1)) drop-shadow(0 0 18px rgba(255,215,0,.5)); }
  }
  @keyframes glowPulseSilver {
    0%,100% { filter: drop-shadow(0 0 3px rgba(232,232,232,.5)); }
    50%      { filter: drop-shadow(0 0 10px rgba(232,232,232,1)) drop-shadow(0 0 18px rgba(232,232,232,.5)); }
  }
  @keyframes glowPulseBronze {
    0%,100% { filter: drop-shadow(0 0 3px rgba(232,168,87,.5)); }
    50%      { filter: drop-shadow(0 0 10px rgba(232,168,87,1)) drop-shadow(0 0 18px rgba(232,168,87,.5)); }
  }

  /*  HEADER  */
  #header {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.5rem;
    z-index: 100;
  }
  .hd-left { display: flex; align-items: center; gap: .75rem; }
  .badge-pantex {
    background: rgba(29,158,117,.15);
    color: var(--green);
    font-size: .6rem; font-weight: 700; letter-spacing: .18em;
    padding: .28rem .7rem; border-radius: 4px;
    border: 1px solid rgba(29,158,117,.3);
  }
  .hd-title { font-size: .78rem; font-weight: 600; letter-spacing: .1em; color: var(--muted); }

  .hd-center { text-align: center; }
  .hd-nav { display: flex; align-items: center; gap: .6rem; }
  .hd-month-wrap { text-align: center; min-width: 140px; }
  .hd-month { font-size: 1rem; font-weight: 700; color: #fff; letter-spacing: .06em; }
  .hd-days  { font-size: .7rem; color: var(--muted); margin-top: 1px; }
  .nav-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: .2rem .55rem;
    font-size: .8rem;
    cursor: pointer;
    transition: border-color .2s, color .2s;
    line-height: 1.6;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
  .nav-btn:disabled { opacity: .25; cursor: default; }

  .hd-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .hd-total { font-size: .7rem; color: var(--muted); }
  .hd-total span { color: var(--green); font-weight: 700; font-size: .85rem; }
  .hd-clock { font-size: 1.05rem; font-weight: 700; color: #fff; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .hd-shift { font-size: .65rem; color: var(--muted); letter-spacing: .07em; }

  /*  GRID  */
  #grid {
    position: fixed;
    top: var(--header-h); left: 0; right: 0; bottom: var(--footer-h);
    padding: 1rem 1rem .75rem;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: .75rem;
  }

  /*  MACHINE CARD  */
  .mcard {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: .55rem .75rem .5rem;
    display: flex; flex-direction: column; gap: .35rem;
    position: relative;
    transition: border-color .5s ease, box-shadow .5s ease;
    animation: fade-in .4s ease both;
    overflow: hidden;
  }
  .mcard.tier3 {
    border-color: var(--green3) !important;
    animation: pulse-border 2s ease-in-out infinite;
  }
  .mcard.rank1 {
    border-width: 2px;
    animation: fade-in .4s ease both, glowGold 1.5s ease-in-out .4s infinite;
  }
  .mcard.rank2 {
    border-width: 2px;
    animation: fade-in .4s ease both, glowSilver 2s ease-in-out .4s infinite;
  }
  .mcard.rank3 {
    border-width: 2px;
    animation: fade-in .4s ease both, glowBronze 2.5s ease-in-out .4s infinite;
  }

  .mcard-header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .mcard-name {
    font-size: .65rem; font-weight: 700; letter-spacing: .12em; color: var(--muted);
  }
  .rank-badge {
    font-size: .68rem; font-weight: 800; letter-spacing: .04em;
    padding: .28rem .7rem; border-radius: 20px;
    border: 1px solid var(--border); color: var(--muted); background: transparent;
    transition: all .4s ease;
  }
  /* 1º lugar: fundo dourado sólido */
  .rank-badge.r1 {
    color: #1a1000;
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 2px 8px rgba(239,159,39,.5);
    padding: .45rem 1rem;
    font-size: 15px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
  }
  /* 2º lugar: fundo prateado sólido */
  .rank-badge.r2 {
    color: #1a1a1a;
    background: var(--silver);
    border-color: var(--silver);
    box-shadow: 0 2px 6px rgba(180,178,169,.4);
    padding: .45rem 1rem;
    font-size: 15px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
  }
  /* 3º lugar: fundo bronze sólido */
  .rank-badge.r3 {
    color: #ffffff;
    background: var(--bronze);
    border-color: var(--bronze);
    box-shadow: 0 2px 6px rgba(205,127,50,.4);
    padding: .45rem 1rem;
    font-size: 15px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
  }

  /*  SHIFTS ROW  */
  .shifts-row {
    display: grid; grid-template-columns: 1fr; gap: .5rem; flex: 1;
  }
  .shift-col {
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .38rem .6rem;
    display: flex; flex-direction: column; gap: .22rem;
  }
  .shift-label {
    font-size: .58rem; font-weight: 700; letter-spacing: .1em; color: var(--muted);
  }
  .shift-total {
    font-size: 1.4rem; font-weight: 700; color: #fff;
    font-variant-numeric: tabular-nums; line-height: 1;
  }

  /*  PROGRESS BAR  */
  .bar-wrap {
    height: 5px; background: rgba(255,255,255,.07); border-radius: 99px; overflow: hidden;
  }
  .bar-fill {
    height: 100%; border-radius: 99px;
    transition: width .8s ease, background-color .5s ease;
  }
  .bar-fill.t0 { background: var(--bar0); }
  .bar-fill.t1 { background: var(--yellow); }
  .bar-fill.t2 { background: var(--green2); }
  .bar-fill.t3 { background: var(--green3); animation: pulse-bar 1.4s ease-in-out infinite; }

  .shift-pct  { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar-mini   { height: 3px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; margin-top: 2px; }
  .bar-mini .bar-fill.t0 { background: rgba(255,255,255,.55); }

  .shift-meta {
    font-size: .58rem; color: var(--muted);
  }
  .shift-meta span { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  /*  BONUS BADGE  */
  .bonus-row { display: flex; align-items: center; justify-content: space-between; margin-top: .1rem; }
  .bonus-badge {
    font-size: .56rem; font-weight: 700; letter-spacing: .08em;
    padding: .15rem .45rem; border-radius: 4px;
    transition: all .4s ease;
  }
  .bb0 { background: rgba(255,255,255,.05); color: var(--muted); }
  .bb1 { background: rgba(239,159,39,.15);  color: var(--yellow); }
  .bb2 { background: rgba(93,202,165,.15);  color: var(--green2); }
  .bb3 { background: rgba(39,199,122,.2);   color: var(--green3); }

  .bonus-value {
    font-size: .65rem; font-weight: 700; color: var(--green);
    font-variant-numeric: tabular-nums;
  }

  /*  SHIFT EXTRA INFO  */
  .shift-extra { font-size: 10px; line-height: 1.3; margin-top: .05rem; }
  .se-time     { color: #888780; }
  .se-repair   { color: #EF9F27; }
  .se-second   { color: #F0997B; }

  /*  FOOTER  */
  #footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--footer-h);
    background: var(--card);
    border-top: 2px solid var(--border);
    display: flex; align-items: center;
    padding: 0 1.5rem; gap: 1.5rem;
  }
  .ft-label {
    font-size: .75rem; font-weight: 700; letter-spacing: .1em;
    color: var(--muted); white-space: nowrap; text-transform: uppercase;
  }
  .ft-sep { width: 1px; height: 32px; background: var(--border); flex-shrink: 0; }

  #ft-ranking {
    display: flex; align-items: center; gap: 1rem; flex: 1; overflow: hidden;
  }
  .ft-rank-item {
    display: flex; align-items: center; gap: .45rem;
    white-space: nowrap;
  }
  .ft-rank-num {
    font-size: .72rem; font-weight: 800; padding: .22rem .5rem;
    border-radius: 5px; min-width: 26px; text-align: center;
  }
  /* Top 3: fundo sólido igual aos badges dos cards */
  .fr1 { background: var(--gold);   color: #1a1000; }
  .fr2 { background: var(--silver); color: #1a1a1a; }
  .fr3 { background: var(--bronze); color: #ffffff; }
  .fr4,.fr5,.fr6 { background: rgba(255,255,255,.08); color: var(--muted); }

  .ft-rank-name { color: var(--text); font-weight: 700; font-size: .85rem; }
  .ft-rank-pct  { color: var(--green); font-weight: 700; font-size: .85rem; }

  #ft-update { font-size: .68rem; color: var(--muted); white-space: nowrap; margin-left: auto; }

  /*  TOTAIS GLOBAIS  */
  .ft-totals { display: flex; align-items: center; gap: .85rem; flex-shrink: 0; }
  .ft-tot-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .ft-tot-lbl {
    font-size: .5rem; font-weight: 700; letter-spacing: .09em;
    padding: .1rem .35rem; border-radius: 3px; white-space: nowrap;
  }
  .ft-tot-meta  { background: rgba(239,159,39,.22); color: var(--yellow); }
  .ft-tot-plain { color: var(--muted); }
  .ft-tot-val {
    font-size: .8rem; font-weight: 700;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
</style>
</head>

<script>
'use strict';

/*  Utilitários  */
const fmt  = n => Number(n).toLocaleString('pt-BR');
const fmtR = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

const TIER_CLS   = ['bb0','bb1','bb2','bb3'];
const TIER_LABEL = ['ABAIXO','B1','B2','B3'];
const BAR_CLS    = ['t0','t1','t2','t3'];

const MESES = ['','JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO',
               'JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];

/*  Relógio  */
function currentShiftLabel() {
  const now  = new Date();
  const h    = now.getHours();
  const m    = now.getMinutes();
  const tot  = h * 60 + m;
  if (tot >= 6 * 60 && tot < 15 * 60 + 20) return '1º TURNO · 06:00 – 15:20';
  if (tot >= 15 * 60 + 20)                  return '2º TURNO · 15:20 – 00:00';
  return 'FORA DO TURNO';
}

function tickClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('hd-clock').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('hd-shift').textContent = currentShiftLabel();
}
setInterval(tickClock, 1000);
tickClock();

/*  Agrupamento machine_id → { t1, t2 }  */
function groupMachines(items) {
  const map = {};
  for (const item of items) {
    if (!map[item.machine_id]) map[item.machine_id] = { id: item.machine_id, t1: null, t2: null };
    if (item.shift === 1) map[item.machine_id].t1 = item;
    else                  map[item.machine_id].t2 = item;
  }
  return Object.values(map).sort((a, b) => a.id - b.id);
}

/*  Ranking por média de pct_meta1 entre T1 e T2  */
function calcRanking(machines) {
  return machines
    .map(m => {
      const p1    = m.t1 ? m.t1.pct_meta1 : 0;
      const p2    = m.t2 ? m.t2.pct_meta1 : 0;
      const count = (m.t1 ? 1 : 0) + (m.t2 ? 1 : 0);
      return { id: m.id, avg: count > 0 ? (p1 + p2) / count : 0 };
    })
    .sort((a, b) => b.avg - a.avg);
}

/*  Informações extras do turno (horas, reparo, 2ªQ)  */
function fmtShiftExtra(data) {
  let html = '';

  if (data.start_time && data.end_time) {
    const [sh, sm] = data.start_time.split(':').map(Number);
    const [eh, em] = data.end_time.split(':').map(Number);
    let minStart = sh * 60 + sm;
    let minEnd   = eh * 60 + em;
    if (minEnd <= minStart) minEnd += 24 * 60; 
    const diffMin = minEnd - minStart;
    const h   = Math.floor(diffMin / 60);
    const m   = diffMin % 60;
    const dur = h && m ? `${h}h ${m}min` : h ? `${h}h` : `${m}min`;
    const hDec  = diffMin / 60;
    const prodH = hDec > 0 ? Math.round(data.total_produced / hDec) : 0;
    html += `<div class="se-time">${dur} · ${fmt(prodH)} pç/h</div>`;
  }

  if (data.repair_qty > 0) {
    html += `<div class="se-repair">↩ ${fmt(data.repair_qty)} rep.</div>`;
  }

  if (data.second_quality_qty > 0) {
    html += `<div class="se-second">▽ ${fmt(data.second_quality_qty)} 2ªQ</div>`;
  }

  return html ? `<div class="shift-extra">${html}</div>` : '';
}

/*  HTML de um turno  */
function shiftHTML(data) {
  if (!data) {
    return `<div class="shift-col">
      <div class="shift-label">—</div>
      <div class="shift-total">—</div>
      <div class="bar-wrap"><div class="bar-fill t0" style="width:0%"></div></div>
      <div class="shift-meta">Meta 1: <span>—</span></div>
      <div class="bonus-row"><span class="bonus-badge bb0">—</span></div>
      <div style="display:flex;gap:4px;margin-top:8px">
        <div style="flex:1;background:#0b0c14;border-radius:6px;padding:4px 6px;text-align:center;border:1px solid #e0525266">
          <div style="font-size:10px;color:#e05252">BONUS 1</div>
          <div style="font-size:12px;font-weight:700;color:#e05252">—</div>
          <div style="font-size:9px;color:#e05252;opacity:.8">—</div>
        </div>
        <div style="flex:1;background:#0b0c14;border-radius:6px;padding:4px 6px;text-align:center;border:1px solid #e0525266">
          <div style="font-size:10px;color:#e05252">BONUS 2</div>
          <div style="font-size:12px;font-weight:700;color:#e05252">—</div>
          <div style="font-size:9px;color:#e05252;opacity:.8">—</div>
        </div>
        <div style="flex:1;background:#0b0c14;border-radius:6px;padding:4px 6px;text-align:center;border:1px solid #e0525266">
          <div style="font-size:10px;color:#e05252">BONUS 3</div>
          <div style="font-size:12px;font-weight:700;color:#e05252">—</div>
          <div style="font-size:9px;color:#e05252;opacity:.8">—</div>
        </div>
      </div>
    </div>`;
  }

  const barW    = data.meta1 > 0
    ? Math.min((data.total_produced / data.meta1) * 100, 100).toFixed(1)
    : '0';
  const bonus   = data.bonus_tier > 0
    ? `<span class="bonus-value">${fmtR(data.bonus_value)}</span>` : '';

  const pctTxt = Number(data.pct_meta1).toFixed(1).replace('.', ',') + '%';

  return `<div class="shift-col">
    <div class="shift-label">Turno ${data.shift}</div>
    <div class="shift-total">${fmt(data.total_produced)}</div>
    <div class="shift-pct">${pctTxt}</div>
    <div class="bar-mini">
      <div class="bar-fill ${BAR_CLS[data.bonus_tier]}" style="width:${barW}%"></div>
    </div>
    <div class="bar-wrap">
      <div class="bar-fill ${BAR_CLS[data.bonus_tier]}" style="width:${barW}%"></div>
    </div>
    <div class="shift-meta">Meta 1: <span>${fmt(data.meta1)}</span></div>
    <div class="bonus-row">
      <span class="bonus-badge ${TIER_CLS[data.bonus_tier]}">${TIER_LABEL[data.bonus_tier]}</span>
      ${bonus}
    </div>
    <div style="display:flex;gap:4px;margin-top:8px">
      <div style="flex:1;background:#0b0c14;border-radius:6px;padding:4px 6px;text-align:center;border:1px solid ${data.bonus_tier===1?'#EF9F2766':'#1e2040'}">
        <div style="font-size:10px;color:${data.bonus_tier===1?'#EF9F27':'#888780'}">BONUS 1</div>
        <div style="font-size:12px;font-weight:700;color:${data.bonus_tier===1?'#EF9F27':'#888780'}">${fmt(data.rate1)} pç/dia</div>
        <div style="font-size:9px;color:${data.bonus_tier===1?'#EF9F27':'#888780'};opacity:.8">${data.bonus_ref1}</div>
        ${data.bonus_tier===1 ? `<div style="font-size:11px;font-weight:600;color:#1D9E75;margin-top:2px">${fmtR(data.bonus_value)}</div>` : ''}
      </div>
      <div style="flex:1;background:#0b0c14;border-radius:6px;padding:4px 6px;text-align:center;border:1px solid ${data.bonus_tier===2?'#5DCAA566':'#1e2040'}">
        <div style="font-size:10px;color:${data.bonus_tier===2?'#5DCAA5':'#888780'}">BONUS 2</div>
        <div style="font-size:12px;font-weight:700;color:${data.bonus_tier===2?'#5DCAA5':'#888780'}">${fmt(data.rate2)} pç/dia</div>
        <div style="font-size:9px;color:${data.bonus_tier===2?'#5DCAA5':'#888780'};opacity:.8">${data.bonus_ref2}</div>
        ${data.bonus_tier===2 ? `<div style="font-size:11px;font-weight:600;color:#1D9E75;margin-top:2px">${fmtR(data.bonus_value)}</div>` : ''}
      </div>
      <div style="flex:1;background:#0b0c14;border-radius:6px;padding:4px 6px;text-align:center;border:1px solid ${data.bonus_tier===3?'#27C77A66':'#1e2040'}">
        <div style="font-size:10px;color:${data.bonus_tier===3?'#27C77A':'#888780'}">BONUS 3</div>
        <div style="font-size:12px;font-weight:700;color:${data.bonus_tier===3?'#27C77A':'#888780'}">${fmt(data.rate3)} pç/dia</div>
        <div style="font-size:9px;color:${data.bonus_tier===3?'#27C77A':'#888780'};opacity:.8">${data.bonus_ref3}</div>
        ${data.bonus_tier===3 ? `<div style="font-size:11px;font-weight:600;color:#1D9E75;margin-top:2px">${fmtR(data.bonus_value)}</div>` : ''}
      </div>
    </div>
    ${fmtShiftExtra(data)}
  </div>`;
}

/*  HTML de um turno no card de ranking  */
function shiftHTMLRank(data) {
  if (!data) {
    return `<div class="shift-col">
      <div class="shift-label" style="text-align:center">—</div>
      <div class="shift-total">—</div>
      <div class="bar-wrap"><div class="bar-fill t0" style="width:0%"></div></div>
      <div class="shift-meta">Meta 1: <span>—</span></div>
      <div class="bonus-row"><span class="bonus-badge bb0">—</span></div>
    </div>`;
  }

  const barW  = data.meta1 > 0
    ? Math.min((data.total_produced / data.meta1) * 100, 100).toFixed(1)
    : '0';
  const bonus = data.bonus_tier > 0
    ? `<span class="bonus-value">${fmtR(data.bonus_value)}</span>` : '';

  const pctTxt = Number(data.pct_meta1).toFixed(1).replace('.', ',') + '%';

  return `<div class="shift-col">
    <div class="shift-label" style="text-align:center;font-size:13px;font-weight:600;letter-spacing:0.8px;color:rgba(255,255,255,.9)">MÁQUINA ${data.machine_id} · TURNO ${data.shift}</div>

/*  Render footer  */
function renderFooter(machines, ranking, data) {
  // Ranking horizontal
  document.getElementById('ft-ranking').innerHTML = ranking.map((r, i) => {
    const pos = i + 1;
    const ftBadge = `<span class="ft-rank-num fr${pos}">${pos}º</span>`;
    return `<div class="ft-rank-item">
      ${ftBadge}
      <span class="ft-rank-name">Maq.&nbsp;${r.id}</span>
      <span class="ft-rank-pct">${r.avg.toFixed(1)}%</span>
    </div>`;
  }).join('');

  // Saldo global (soma dos saldos vs meta1 de todos os turnos)
  let saldo = 0;
  machines.forEach(m => {
    if (m.t1) saldo += m.t1.saldo;
    if (m.t2) saldo += m.t2.saldo;
  });
  const color = saldo >= 0 ? '#1D9E75' : '#e05252';
  document.getElementById('ft-saldo').innerHTML =
    `<span style="color:${color};font-weight:700">${fmt(saldo)}</span>`;

  document.getElementById('ft-update').textContent =
    `Atualizado às ${new Date().toLocaleTimeString('pt-BR')}`;

  // Totais globais
  const grandSaldo      = data.grand_total - data.grand_meta1;
  const grandSaldoColor = grandSaldo >= 0 ? '#1D9E75' : '#e05252';
  document.getElementById('ft-grand-meta1').textContent = fmt(data.grand_meta1);
  document.getElementById('ft-grand-meta2').textContent = fmt(data.grand_meta2);
  document.getElementById('ft-grand-meta3').textContent = fmt(data.grand_meta3);
  document.getElementById('ft-grand-total').textContent = fmt(data.grand_total);
  document.getElementById('ft-grand-saldo').innerHTML =
    `<span style="color:${grandSaldoColor}">${fmt(grandSaldo)}</span>`;
}

/* ── Navegação de mês ─────────────────────────────────────────────────────── */
const _now = new Date();
let viewYear  = _now.getFullYear();
let viewMonth = _now.getMonth() + 1;

function _isCurrentMonth() {
  const n = new Date();
  return viewYear === n.getFullYear() && viewMonth === n.getMonth() + 1;
}

function navMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 1)  { viewMonth = 12; viewYear--; }
  if (viewMonth > 12) { viewMonth = 1;  viewYear++; }
  document.getElementById('btn-next').disabled = _isCurrentMonth();
  fetchData();
}

/* ── Render header ────────────────────────────────────────────────────────── */
function renderHeader(data) {
  const [mm, yyyy] = data.month.split('/');
  document.getElementById('hd-month').textContent = `${MESES[+mm]} ${yyyy}`;
  document.getElementById('hd-days').textContent  = `${data.business_days} dias úteis`;
  document.getElementById('hd-grand').textContent = fmt(data.grand_total);
  document.getElementById('btn-next').disabled = _isCurrentMonth();
}

/* ── Fetch principal ──────────────────────────────────────────────────────── */
let lastFetchedMonth = null;

async function fetchData() {
  try {
    const isCurrent = _isCurrentMonth();
    const url = isCurrent
      ? '/api/summary'
      : `/api/summary?year=${viewYear}&month=${viewMonth}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if (isCurrent) {
      if (lastFetchedMonth !== null && lastFetchedMonth !== data.month) {
        window.location.reload();
        return;
      }
      lastFetchedMonth = data.month;
    }

    const machines = groupMachines(data.machines);
    const ranking  = calcRanking(machines);

    renderHeader(data);
    renderCards(data.machines);
    renderFooter(machines, ranking, data);
  } catch (err) {
    console.error('Erro ao buscar dados:', err);
    document.getElementById('ft-update').textContent =
      `Falha na atualização — ${new Date().toLocaleTimeString('pt-BR')}`;
  }
}

/* ── Tema ─────────────────────────────────────────────────────────────────── */
function toggleTheme() {
  const root = document.documentElement;
  const btn  = document.getElementById('theme-btn');
  const isLight = root.classList.toggle('light');
  btn.textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('pantex-theme', isLight ? 'light' : 'dark');
}

// Restaura tema salvo
(function () {
  if (localStorage.getItem('pantex-theme') === 'light') {
    document.documentElement.classList.add('light');
    document.getElementById('theme-btn').textContent = '☀️';
  }
})();

fetchData();
setInterval(fetchData, 30_000);
</script>
